name: 🔐 ACL Cloud 自动续期（弹窗验证码+全程录屏）

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  DISPLAY: :99

permissions:
  contents: read
  actions: write

jobs:
  auto-renew:
    name: 🎬 自动登录续期+全程录屏
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 安装系统依赖（Chromium + ffmpeg + 虚拟桌面）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            chromium-browser chromium-chromedriver \
            tesseract-ocr tesseract-ocr-eng \
            ffmpeg xvfb libx11-xcb1 libxcb-dri3-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6
      
      - name: 📦 安装 Python 依赖
        run: |
          pip install --upgrade pip -q
          pip install selenium pillow pytesseract requests -q
      
      - name: 🏃 执行自动登录续期脚本
        id: automation
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_LOGIN_URL: ${{ secrets.ACL_LOGIN_URL || 'https://aclclouds.com/auth/login' }}
        run: |
          echo "⏰ 开始时间：$(date '+%Y-%m-%d %H:%M:%S')"
          python acl_renew.py && echo "status=success" >> $GITHUB_OUTPUT || echo "status=failure" >> $GITHUB_OUTPUT
      
      - name: 📤 上传录屏和全步骤截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-record-${{ github.run_id }}
          path: |
            screenshots/
            full_operation_recording.mp4
          retention-days: 30
      
      - name: 📊 输出运行报告
        if: always()
        run: |
          echo "================================"
          echo "   ACL Cloud 自动续期报告"
          echo "================================"
          echo "运行时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "运行状态: ${{ steps.automation.outputs.status }}"
          echo "录屏文件: full_operation_recording.mp4"
          echo "截图目录: screenshots/"
          echo "================================"

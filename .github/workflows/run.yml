# ============================================
# ACL Cloud 自动续期工作流（全流程录屏版）
# 功能：自动登录、双验证码处理、FFmpeg全程录屏
# 触发方式：定时任务 + 手动触发
# ============================================

name: 🔐 ACL Cloud 自动续期（全流程录屏）

on:
  schedule:
    - cron: '0 2,14 * * *'
  
  workflow_dispatch:
    inputs:
      log_level:
        description: '日志级别'
        required: true
        default: 'info'
        type: choice
        options:
          - debug
          - info
          - warning
          - error

env:
  PYTHON_VERSION: '3.11'
  RECORDING_FILE: operation_recording.mp4

permissions:
  contents: read
  actions: write

jobs:
  login-and-renew:
    name: 🚀 自动登录并续期（全程录屏）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 配置 Python ${{ env.PYTHON_VERSION }} 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 安装系统依赖（含FFmpeg和虚拟桌面）
        run: |
          echo "🔧 正在安装系统依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            chromium-browser \
            chromium-chromedriver \
            tesseract-ocr \
            tesseract-ocr-eng \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config \
            ffmpeg \
            xvfb
          echo "✅ 系统依赖安装完成"
      
      - name: 📦 安装 Python 依赖
        run: |
          echo "🔧 正在安装 Python 依赖..."
          pip install --upgrade pip -q
          pip install selenium pillow pytesseract requests -q
          echo "✅ Python 依赖安装完成"
      
      - name: 🔍 验证环境配置
        run: |
          echo "📋 环境信息："
          echo "  - Python 版本：$(python --version)"
          echo "  - Chromium 版本：$(chromium-browser --version)"
          echo "  - Tesseract 版本：$(tesseract --version | head -1)"
          echo "  - FFmpeg 版本：$(ffmpeg -version | head -1)"
      
      - name: 🎥 启动虚拟桌面 + FFmpeg 全程录屏
        id: automation
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_LOGIN_URL: ${{ secrets.ACL_LOGIN_URL || 'https://aclclouds.com/auth/login' }}
        run: |
          echo "⏰ 开始时间：$(date '+

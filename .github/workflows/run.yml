# ============================================
# ACL Cloud 自动登录 + 续期工作流（全步骤截图版）
# 功能：自动登录 ACL Cloud，处理验证码，执行续期，每一步都截图
# 触发方式：定时任务 + 手动触发
# ============================================

name: 🔐 ACL Cloud 自动续期（全步骤截图）

on:
  schedule:
    - cron: '0 2,14 * * *'
  
  workflow_dispatch:
    inputs:
      log_level:
        description: '日志级别'
        required: true
        default: 'info'
        type: choice
        options:
          - debug
          - info
          - warning
          - error

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  actions: write

jobs:
  login-and-renew:
    name: 🚀 自动登录并续期（全步骤截图）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 配置 Python ${{ env.PYTHON_VERSION }} 环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 安装系统依赖
        run: |
          echo "🔧 正在安装系统依赖..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            chromium-browser \
            chromium-chromedriver \
            tesseract-ocr \
            tesseract-ocr-eng \
            libtesseract-dev \
            libleptonica-dev \
            pkg-config
          echo "✅ 系统依赖安装完成"
      
      - name: 📦 安装 Python 依赖
        run: |
          echo "🔧 正在安装 Python 依赖..."
          pip install --upgrade pip -q
          pip install selenium pillow pytesseract requests -q
          echo "✅ Python 依赖安装完成"
      
      - name: 🔍 验证环境配置
        run: |
          echo "📋 环境信息："
          echo "  - Python 版本：$(python --version)"
          echo "  - Chromium 版本：$(chromium-browser --version)"
          echo "  - Tesseract 版本：$(tesseract --version | head -1)"
      
      - name: 🏃 执行登录和续期脚本（全步骤截图）
        id: automation
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          ACL_LOGIN_URL: ${{ secrets.ACL_LOGIN_URL || 'https://aclclouds.com/auth/login' }}
        run: |
          echo "⏰ 开始时间：$(date '+%Y-%m-%d %H:%M:%S')"
          echo "🔑 正在执行自动登录和续期（全步骤截图）..."
          
          if python acl_renew.py; then
            echo "✅ 操作成功完成！"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 操作失败！"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      # 上传所有截图（无论成功还是失败）
      - name: 📸 上传全步骤截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 30  # 保留 30 天，方便长期排查
          if-no-files-found: warn
      
      - name: 📬 输出操作结果
        if: always()
        run: |
          STATUS="${{ steps.automation.outputs.status }}"
          TIME="$(date '+%Y-%m-%d %H:%M:%S')"
          
          echo "================================"
          echo "   ACL Cloud 自动续期报告"
          echo "================================"
          echo ""
          echo "📅 运行时间：$TIME"
          echo "🆔 运行编号：${{ github.run_id }}"
          echo "📊 操作状态：$STATUS"
          echo ""
          
          if [ "$STATUS" == "success" ]; then
            echo "🎉 自动续期成功！"
            echo "📸 全步骤截图已上传到 Artifacts"
          else
            echo "❌ 自动续期失败，请检查截图排查问题。"
            echo "📸 全步骤截图已上传到 Artifacts，请下载查看"
          fi
          echo ""
          echo "================================"

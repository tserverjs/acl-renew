name: Kerit Cloud Renew with CloakBrowser

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-stealth-renew:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 安装系统依赖
      run: |
        sudo apt-get update -y
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y \
          xvfb curl wget wmctrl ffmpeg scrot \
          fonts-noto-color-emoji xdotool \
          x11-utils x11-xserver-utils ttf-mscorefonts-installer \
          libnss3 libatk-bridge2.0-0 libxss1 libgtk-3-0
        sudo fc-cache -f -v

    - name: 🌐 启动 GOST 代理隧道
      env:
        GOST_PROXY: ${{ secrets.GOST_PROXY }}
      run: |
        VERSION=$(curl -s https://api.github.com/repos/go-gost/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
        wget -q "https://github.com/go-gost/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
        tar -xzf gost_${VERSION}_linux_amd64.tar.gz
        chmod +x ./gost
        nohup ./gost -L socks5://:40000 -F "${GOST_PROXY}" > gost-proxy.log 2>&1 &
        
        echo "⏳ 等待代理隧道..."
        for i in {1..30}; do
          sleep 1
          EXIT_IP=$(curl -s --max-time 5 --proxy socks5://127.0.0.1:40000 https://api.ipify.org 2>/dev/null || true)
          if [ -n "${EXIT_IP}" ]; then
            echo "✅ 代理就绪，出口IP: ${EXIT_IP}"
            break
          fi
          echo "  第 $i 秒等待中..."
        done
        
        if [ -z "${EXIT_IP}" ]; then
          echo "❌ 代理隧道连接失败"
          cat gost-proxy.log
          exit 1
        fi

    - name: Install Python Dependencies
      run: |
        pip install cloakbrowser

    - name: 🎬 启动虚拟桌面并执行自动化
      env:
        KERIT_ACCOUNT: ${{ secrets.KERIT_ACCOUNT }}
        TG_BOT: ${{ secrets.TG_BOT }}
      run: |
        Xvfb :99 -ac -screen 0 1920x1080x24 +extension RANDR > /dev/null 2>&1 &
        sleep 3
        
        export DISPLAY=:99
        
        echo "🎥 启动屏幕录像..."
        DISPLAY=:99 ffmpeg -f x11grab -video_size 1920x1080 -i :99.0 \
          -codec:v libx264 -pix_fmt yuv420p -r 30 \
          cloak_run_record.mp4 > ffmpeg.log 2>&1 &
        FFMPEG_PID=$!
        sleep 2

        # 窗口最大化守护
        (
          export DISPLAY=:99
          for i in {1..60}; do
            sleep 1
            WINDOW_ID=$(wmctrl -l 2>/dev/null | grep -iE "chrome|chromium|cloak" | head -1 | awk '{print $1}')
            if [ -n "$WINDOW_ID" ]; then
              echo "🎯 捕获浏览器窗口，最大化..."
              wmctrl -i -r "$WINDOW_ID" -b add,maximized_vert,maximized_horz 2>/dev/null || true
              wmctrl -i -a "$WINDOW_ID" 2>/dev/null || true
              break
            fi
          done
        ) &

        echo "🚀 运行 CloakBrowser 自动化..."
        python auto-renew.py || touch .script_failed

        echo "🛑 保存录像..."
        kill -SIGINT $FFMPEG_PID 2>/dev/null || true
        sleep 3
        kill $FFMPEG_PID 2>/dev/null || true
        sleep 1

        if [ -f .script_failed ]; then
          echo "❌ 脚本执行失败"
          exit 1
        fi

    - name: 📦 上传操作录像
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-video-record
        path: cloak_run_record.mp4
        retention-days: 7

    - name: 📦 上传调试截图
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshots
        path: |
          debug_*.png
          error_*.png
          *.png
        retention-days: 7

    - name: 📦 上传认证状态
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kerit-auth-state
        path: |
          kerit_auth.json
          cloak-profile/
        retention-days: 3

name: ACL Cloud Auto (Playwright + Standard Sources)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
  ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
  ACL_LOGIN_URL: ${{ vars.ACL_LOGIN_URL || 'https://aclclouds.com/auth/login' }}
  WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}

jobs:
  auto-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 替换 Apt 源为阿里云镜像
      - name: Change Apt Mirrors
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::http::Timeout="15"
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra \
            fonts-noto-cjk fonts-wqy-zenhei

          # 2. 替换 PyPI 源为清华镜像安装 Python 库
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --upgrade pip
          pip install -i https://pypi.tuna.tsinghua.edu.cn/simple playwright pillow pytesseract requests

          # 3. 安装 Chromium 浏览器及其系统依赖 (内置源)
          playwright install --with-deps chromium
          echo "✅ 依赖与浏览器安装完成"

      - name: Verify Playwright
        run: |
          python -c "from playwright.sync_api import sync_playwright; print('Playwright OK')"
          python -c "from playwright.sync_api import sync_playwright as sp; p=sp().__enter__(); b=p.chromium.launch(headless=True); print('Chromium headless launch OK'); b.close(); p.stop()"

      - name: Run automation
        run: |
          mkdir -p videos
          python3 acl_renewal.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording-${{ github.run_id }}-${{ github.run_attempt }}
          path: videos/
          retention-days: 3

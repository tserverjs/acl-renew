# =============================================================================
# 🎬 ACL Cloud 自动续期 & 服务器管理（Playwright + Xvfb + ffmpeg 完整录屏版 + GOST代理）
#   支持通过 GOST 代理隧道访问目标站点并录制完整 UI 过程
# =============================================================================

name: 🎬 ACL Cloud 自动续期 · 完整浏览器录屏

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      video_size:
        description: '📐 录屏分辨率'
        required: false
        default: '1920x1080'
        type: choice
        options:
          - '1920x1080'
          - '1280x720'

env:
  ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
  ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
  ACL_LOGIN_URL: ${{ vars.ACL_LOGIN_URL || 'https://aclclouds.com/auth/login' }}
  WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}

jobs:
  auto-renewal:
    name: 🎭 完整浏览器录屏自动化
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐧 安装系统依赖（Xvfb / ffmpeg / Tesseract / 字体）
        run: |
          echo "⚡ 启用 apt 加速模式..."
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Dpkg::Use-Pty=0 -o Acquire::Retries=3 eatmydata
          
          echo "⏳ 正在安装依赖包（eatmydata 加速中）..."
          sudo eatmydata apt-get install -y -qq -o Dpkg::Use-Pty=0 -o Acquire::Retries=3 \
            xvfb \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-fra \
            fonts-noto-cjk \
            fonts-wqy-zenhei \
            libglib2.0-0
          echo "✅ 系统依赖安装完成"

      - name: 🌐 启动 GOST 代理隧道
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "${GOST_PROXY}" ]; then
            echo "❌ 致命错误: 未在仓库配置 secrets.GOST_PROXY"
            exit 1
          fi

          echo "⬇️  获取 GOST 最新版本并下载..."
          GOST_VERSION=$(curl -s https://api.github.com/repos/go-gost/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $GOST_VERSION"

          wget -q "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          tar -xzf gost_${GOST_VERSION}_linux_amd64.tar.gz
          chmod +x ./gost

          echo "🚀 启动 GOST 本地转发 (SOCKS5 服务端口: 40000)..."
          nohup ./gost -L socks5://:40000 -F "${GOST_PROXY}" > gost.log 2>&1 &

          sleep 6

          echo "🔍 测试 GOST 代理连接状态..."
          EXIT_IP=$(curl -s --max-time 10 --proxy socks5://127.0.0.1:40000 https://api.ipify.org || true)

          if [ -z "${EXIT_IP}" ]; then
            echo "❌ 代理隧道连接失败，正在打印 gost 日志..."
            cat gost.log
            exit 1
          fi

          echo "✅ GOST 代理隧道已就绪，当前代理出口 IP: ${EXIT_IP}"

      - name: 🐍 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装 Python 依赖 & Playwright Chromium
        run: |
          pip install -q --upgrade pip
          pip install -q playwright pillow pytesseract requests
          echo "⏳ 下载 Chromium..."
          playwright install chromium
          echo "✅ Playwright + Chromium 就绪"

      - name: 🔍 验证运行环境
        run: |
          echo "┌──────────────────────────────────────────┐"
          echo "│            🔍 环境验证报告               │"
          echo "├──────────────────────────────────────────┤"
          echo -n "│ Xvfb          "
          xvfb-run --auto-servernum -- echo "✅ 正常" || echo "❌ 异常"
          echo -n "│ ffmpeg        "
          ffmpeg -version 2>/dev/null | head -1 | awk '{print "✅ " $3}' || echo "❌ 异常"
          echo -n "│ Python        "
          python3 --version | awk '{print "✅ " $2}'
          echo -n "│ Playwright    "
          python3 -c "from playwright.sync_api import sync_playwright; print('✅ 已安装')"
          echo -n "│ Chromium      "
          python3 -c "from playwright.sync_api import sync_playwright as sp; p=sp().__enter__(); b=p.chromium.launch(headless=True); print('✅ Headless 启动正常'); b.close(); p.stop()"
          echo -n "│ Tesseract     "
          tesseract --version 2>/dev/null | head -1 | awk '{print "✅ " $4}' || echo "❌ 异常"
          echo "└──────────────────────────────────────────┘"

      - name: 🤖 执行自动化脚本（v7.7 带 GOST 代理与防阻塞续期版）
        run: |
          mkdir -p videos
          echo "🚀 脚本启动中..."
          python3 acl_cloud_renew_v7.7.py
          echo "🏁 脚本执行完毕"
        env:
          PYTHONUNBUFFERED: "1"
          # 传入本地 GOST 的 SOCKS5 监听端口给 Python 脚本
          SOCKS5_PROXY: "socks5://127.0.0.1:40000"

      - name: 🎬 上传屏幕录屏（完整浏览器 UI）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 🎥-完整浏览器录屏-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            full_operation_recording.mp4
            videos/*.png
          retention-days: 3
          if-no-files-found: warn

      - name: 🧹 清理临时文件
        if: always()
        run: |
          rm -f full_operation_recording.mp4
          rm -rf videos/
          echo "🧹 清理完成"

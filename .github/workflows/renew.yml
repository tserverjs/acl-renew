name: ACL Cloud Auto (Playwright + No Xvfb)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
  ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
  ACL_LOGIN_URL: ${{ vars.ACL_LOGIN_URL || 'https://aclclouds.com/auth/login' }}
  WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}

jobs:
  auto-renewal:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra \
            ffmpeg \
            fonts-noto-cjk fonts-wqy-zenhei
          pip install playwright pillow pytesseract requests
          playwright install chromium
          echo "✅ 依赖安装完成"

      - name: Verify Playwright
        run: |
          python -c "from playwright.sync_api import sync_playwright; print('Playwright OK')"
          python -c "from playwright.sync_api import sync_playwright as sp; p=sp().__enter__(); b=p.chromium.launch(headless=True); print('Chromium headless launch OK'); b.close(); p.stop()"

      - name: Run automation
        run: |
          mkdir -p videos
          python3 acl_renewal.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording-${{ github.run_id }}-${{ github.run_attempt }}
          path: videos/
          retention-days: 3
